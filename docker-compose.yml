services:
  db:
    image: postgres:15
    container_name: todo_app_db
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: todo_app_backend
    ports:
      - "7860:7860"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/todo_app
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AIzaSyD5dkzelZm-oIFv2jd6yoYJ7-7KDGxoLfA}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-a-string-secret-at-least-256-bits-long}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-your-openrouter-api-key-here}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"  # Changed to "no" to prevent endless restart loop during debugging

  frontend:
    build:
      context: ./frontend
    container_name: todo_app_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:7860
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: